<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.88.1">

    <title>Investment Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        .dropdown-menu[data-bs-popper] {
            top: 100%;
            left: auto;
            margin-top: .125rem;
        }
    </style>

    <!-- Custom styles for this template -->
    <link href="cover.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const firstDropdown = document.getElementById('firstDropdown');
            const secondDropdown = document.getElementById('secondDropdown');

            const income_expense = {{ fund_house | tojson }};

        const options = {{ schemes | tojson}};

        firstDropdown.disabled = false;
        firstDropdown.innerHTML = '';


        income_expense.forEach(option => {
            const optionElement = document.createElement('option');
            optionElement.textContent = option;
            optionElement.value = option;
            firstDropdown.appendChild(optionElement);
        });

        firstDropdown.addEventListener('change', function () {
            secondDropdown.disabled = false;
            secondDropdown.innerHTML = '';

            const selectedOption = this.value;

            Object.keys(options[selectedOption]).forEach(option => {
                const optionElement = document.createElement('option');
                optionElement.textContent = option;
                optionElement.value = options[selectedOption][option];
                secondDropdown.appendChild(optionElement);
            });
        });
    });
    </script>

</head>



<body class="text-white bg-success">
    <div class="cover-container mx-auto mt-5 pt-5">
        <div class="row">
            {% include "/include/navbar.html" %}
        </div>

        {% if show %}
        {% if body.status != 200 %}
        <div class="row">
            <div class="col">
                <div class="alert alert-danger alert-dismissible fade show">
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    <strong>ERROR!</strong> {{body.message}}
                </div>
            </div>
        </div>
        {% endif %}
        {% if body.status == 200 %}
        <div class="row">
            <div class="col">
                <div class="alert alert-success alert-dismissible fade show">
                    <a class="close" aria-current="page" href="/website/home">Go back</a>
                    <strong>Added Successfully!</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>
        </div>
        {% endif %}
        {% endif %}

        <div class="row text-black justify-content-center align-items-center">
            <div class="col-sm-8 col-md-6">
                <br>
                <form method="POST">

                    <div class="row mb-3">
                        <div class="col">
                            <label for="firstDropdown" class="form-label"><strong>Fund House</strong></label>
                            <select class="form-select" id="firstDropdown" name="fund_house" disabled>
                                <option>Please select fund house first</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="secondDropdown" class="form-label"><strong>Schemes invested</strong></label>
                            <select class="form-select" id="secondDropdown" name="scheme_code" disabled>
                                <option>Please select scheme you are invested in</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="principle" class="form-label"><strong>Allocation</strong></label>
                        <input type="text" class="form-control" name="allocation" id="amount"
                            placeholder="Enter Allocation">
                    </div>

                    <div class="mb-3 text-center">
                        <button type="submit" class="btn btn-primary" value="Submit">Submit</button>
                        <button type="reset" class="btn btn-primary" value="reset">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
