<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Summary</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"> -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        .dropdown-menu[data-bs-popper] {
            top: 100%;
            left: auto;
            margin-top: .125rem;
        }
        @media (max-width: 768px) {
            .table-responsive table {
                font-size: 14px; /* Adjust the font size for smaller screens */
            }
        }

        @media (max-width: 576px) {
            .table-responsive table {
                font-size: 12px; /* Further reduce the font size for even smaller screens */
            }
        }

    </style>
</head>

<body class="d-flex text-center text-black">
    <div class="cover-container d-flex w-100 h-100 mx-auto flex-column pt-5">
        <div class="row row-cols-1">
            {% include "/include/navbar.html" %}

            <div class="col bg-black text-white">
                <div class="container py-5">
                    <div class="row">
                        
                            <h2>Select the year from the dropdown</h2>
                            <div class="dropdown">
                                <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                                  Select an option
                                </button>
                                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                                    <li><a class="dropdown-item" href="#">All</a></li>
                                    {% for x in years %}                                    
                                        <li><a class="dropdown-item" href="#">{{x}}</a></li>
                                    {% endfor %}
                                </ul>
                            </div>                        
                    </div>
                    <br><br>
                    <div class="row">

                        <!--<h2>Overall Cash Flow</h2><br>-->

                        <div class="col">
                            <h4>Total Expense</h4>
                            <h3 id="total_expense">₹ 0</h3>
                        </div>
                        <div class="col">
                            <h4>Total Income</h4>
                            <h3 id="total_income">₹ 0</h3>
                        </div>
                        <div class="col">
                            <h4>Total Invested</h4>
                            <h3 id="total_invest">₹ 0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container bg-primary">
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                      <button class="nav-link text-black active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab" aria-controls="home" aria-selected="true"><strong>Month Wise</strong></button>
                    </li>
                    <li class="nav-item" role="presentation">
                      <button class="nav-link text-black" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab" aria-controls="profile" aria-selected="false"><strong>Category Wise</strong></button>
                    </li>
                    <!-- <li class="nav-item" role="presentation">
                      <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab" aria-controls="contact" aria-selected="false">Contact</button>
                    </li> -->
                </ul>
            </div>

            <div class="tab-content" id="myTabContent">
                <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
                    <div class="col">
                        <div class="py-5">
                            <div class="row ">
                                <div class="col">
                                    <h3>Month</h3>
                                </div>
                                <div class="col">
                                    <h3>Expense</h3>
                                </div>
                                <div class="col">
                                    <h3>Income</h3>
                                </div>
                                
                                <div class="col">
                                    <h3>Invested</h3>
                                </div>
                                
                            </div>
                        </div>
                    </div>
        
                    <div class="col">
                        <div id="summary-table">
                            <div class="accordion" id="myAccordionMonth">
                                <!-- dynamic code  -->
                            </div>
        
                        </div>
        
                    </div>
                </div>
                <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab">
                    <div class="col">
                        <div class="py-5">
                            <div class="row ">
                                <div class="col">
                                    <h3>Category</h3>
                                </div>
                                <div class="col">
                                    <h3>Total</h3>
                                </div>
                            </div>
                        </div>
                    </div>
        
                    <div class="col">
                        <div id="summary-table" >
                            <div class="accordion" id="myAccordionCategory">
                                <!-- dynamic code  -->
                            </div>
        
                        </div>
        
                    </div>
                </div>
                <!-- <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">
                  <h3>Contact Content</h3>
                  <p>This is the content for the Contact tab.</p>
                </div> -->
              </div>

        </div>
    </div>


    <script>
        // Sample JSON data
        const jsonData = {{ body| tojson}};

        // Function to generate summary rows based on month of expense_date
        function generateMonthWiseSummaryRows(data) {
            const summaryTable = document.getElementById('myAccordionMonth');
            const summaryMap = new Map();
            var total_expense = 0
            var total_income = 0
            var total_invest = 0

            // Iterate over the data to calculate total expense and total income for each month
            data.forEach(item => {
                const month = item.expense_date.slice(0, 7); // Extracting the year and month
                if (!summaryMap.has(month)) {
                    summaryMap.set(month, {
                        totalExpense: 0,
                        totalIncome: 0,
                        totalInvest: 0,
                        details: []
                    });
                }
                if (item.income_expense === 'Expense') {
                    total_expense += item.amount;
                    summaryMap.get(month).totalExpense += item.amount;
                } else if (item.income_expense === 'Income') {
                    total_income += item.amount;
                    summaryMap.get(month).totalIncome += item.amount;
                } else if (item.income_expense === 'Invest') {
                    total_invest += item.amount;
                    summaryMap.get(month).totalInvest += item.amount;
                }
                summaryMap.get(month).details.push(item);
            });

            document.getElementById('total_expense').innerHTML = '₹ ' + new Intl.NumberFormat('en-IN').format(total_expense.toFixed(2));
            document.getElementById('total_income').innerHTML = '₹ ' + new Intl.NumberFormat('en-IN').format(total_income.toFixed(2));
            document.getElementById('total_invest').innerHTML = '₹ ' + new Intl.NumberFormat('en-IN').format(total_invest.toFixed(2));

            // Generate summary rows
            summaryMap.forEach((summaryData, month) => {
                const summaryRow = document.createElement('div');
                summaryRow.classList.add('accordion-item');
                summaryRow.innerHTML = `
                    <h2 class="accordion-header " id="header${month}">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${month}" aria-expanded="false" aria-controls="collapse${month}">
                            <div class="row w-100 h-100 mx-auto text-center">
                                <div class="col">
                                    <h6>${month.replaceAll('_', ' ')}</h6>
                                </div>
                                <div class="col">
                                    <h6 class="text-danger">₹ ${new Intl.NumberFormat('en-IN').format(summaryData.totalExpense.toFixed(2))}</h6>
                                </div>
                                <div class="col">
                                    <h6 class="text-success">₹ ${new Intl.NumberFormat('en-IN').format(summaryData.totalIncome.toFixed(2))}</h6>
                                </div>
                                <div class="col">
                                    <h6 class="text-primary">₹ ${new Intl.NumberFormat('en-IN').format(summaryData.totalInvest.toFixed(2))}</h6>
                                </div>
                            </div>
                        </button>
                    </h2>
                    <div id="collapse${month}" class="accordion-collapse collapse" aria-labelledby="header${month}" data-bs-parent="#myAccordionMonth">
                        <div class="accordion-body">
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th>Category</th>
                                            <th>Sub Category</th>
                                            <th>Type</th>
                                            <th>Amount</th>
                                            <th>Note</th>
                                        </tr>
                                    </thead>
                                    <tbody class="details-row-${month}">
                                        <!-- Details rows will be dynamically generated here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                summaryTable.appendChild(summaryRow);

                // Generate details rows for each month
                summaryData.details.forEach(item => {
                    const detailsRow = document.createElement('tr');
                    detailsRow.innerHTML = `
                        <td>${item.expense_date}</td>
                        <td>${item.category}</td>
                        <td>${item.sub_category}</td>
                        <td>${item.income_expense}</td>
                        <td>₹ ${new Intl.NumberFormat('en-IN').format(item.amount.toFixed(2))}</td>
                        <td>${item.note}</td>
                    `;
                    // Add classes based on income_expense value
                    if (item.income_expense === 'Income') {
                        // detailsRow.bgColor = '#d6ffd6';
                        detailsRow.classList.add("table-success");
                    } else if (item.income_expense === 'Expense') {
                        // detailsRow.bgColor= "#b42d2d";
                        detailsRow.classList.add("table-danger");
                    } else if (item.income_expense === 'Invest') {
                        // detailsRow.bgColor= "#b42d2d";
                        detailsRow.classList.add("table-primary");
                    }
                    summaryRow.querySelector(`.details-row-${month}`).appendChild(detailsRow);
                });

            });
        }

        // Function to generate summary rows based on category
        function generateCategoryWiseSummaryRows(data) {
            const summaryTable = document.getElementById('myAccordionCategory');
            const summaryMap = new Map();

            // Iterate over the data to calculate total expense and total income for each category
            data.forEach(item => {
                const category = item.category.replaceAll(' ', '_') + '_' + item.income_expense ; // Extracting the category
                if (!summaryMap.has(category)) {
                    summaryMap.set(category, {
                        totalExpense: 0,
                        totalIncome: 0,
                        details: []
                    });
                }
                
                summaryMap.get(category).totalExpense += item.amount;
                
                // if (item.income_expense === 'Expense') {
                    // summaryMap.get(category).totalExpense += item.amount;
                // } else if (item.income_expense === 'Income') {
                    // summaryMap.get(category).totalIncome += item.amount;
                // }
                summaryMap.get(category).details.push(item);
            });

            
            // Generate summary rows
            summaryMap.forEach((summaryData, category) => {
                const summaryRow = document.createElement('div');
                summaryRow.classList.add('accordion-item');
                summaryRow.innerHTML = `
                    <h2 class="accordion-header " id="header${category}">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${category}" aria-expanded="false" aria-controls="collapse${category}">
                            <div class="row w-100 h-100 mx-auto text-center">
                                <div class="col">
                                    <h6>${category.replaceAll('_', ' ').replaceAll('Expense', '').replaceAll('Income','').replaceAll('Invest','')}</h6>
                                </div>
                                <div class="col">
                                    <h6 class=${(category.indexOf('Expense') > -1) ? "text-danger":"text-success" }>₹ ${new Intl.NumberFormat('en-IN').format(summaryData.totalExpense.toFixed(2))}</h6>
                                </div>
                            </div>
                        </button>
                    </h2>
                    <div id="collapse${category}" class="accordion-collapse collapse" aria-labelledby="header${category}" data-bs-parent="#myAccordionCategory">
                        <div class="accordion-body">
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th>Category</th>
                                            <th>Sub Category</th>
                                            <th>Type</th>
                                            <th>Amount</th>
                                            <th>Note</th>
                                        </tr>
                                    </thead>
                                    <tbody class="details-row-${category}">
                                        <!-- Details rows will be dynamically generated here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                summaryTable.appendChild(summaryRow);

                // Generate details rows for each category
                summaryData.details.forEach(item => {
                    const detailsRow = document.createElement('tr');
                    detailsRow.innerHTML = `
                        <td>${item.expense_date}</td>
                        <td>${item.category}</td>
                        <td>${item.sub_category}</td>
                        <td>${item.income_expense}</td>
                        <td>₹ ${new Intl.NumberFormat('en-IN').format(item.amount.toFixed(2))}</td>
                        <td>${item.note}</td>
                    `;
                    // Add classes based on income_expense value
                    if (item.income_expense === 'Income') {
                        // detailsRow.bgColor = '#d6ffd6';
                        detailsRow.classList.add("table-success");
                    } else if (item.income_expense === 'Expense') {
                        // detailsRow.bgColor= "#b42d2d";
                        detailsRow.classList.add("table-danger");
                    } else if (item.income_expense === 'Invest') {
                        // detailsRow.bgColor= "#b42d2d";
                        detailsRow.classList.add("table-primary");
                    }
                    summaryRow.querySelector(`.details-row-${category}`).appendChild(detailsRow);
                });

            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            // Get dropdown menu
            var dropdownMenu = document.getElementById('dropdownMenuButton');

            // Get dropdown items
            var dropdownItems = document.querySelectorAll('.dropdown-item');

            // Attach event listener for 'click' event on dropdown items
            dropdownItems.forEach(function (item) {
                item.addEventListener('click', function (event) {
                    // Get selected option
                    var selectedOption = event.target.textContent.trim();

                    // Set the selected option as dropdown button text
                    dropdownMenu.textContent = selectedOption;

                    // Get reference to the div
                    var myAccordionMonth = document.getElementById('myAccordionMonth');
                    var myAccordionCategory = document.getElementById('myAccordionCategory');

                    // Clear its content
                    myAccordionMonth.innerHTML = '';
                    myAccordionCategory.innerHTML = '';

                    if (selectedOption === 'All') {
                        // Initialize an empty array to store the values
                        var allValues = [];

                        // Iterate over the keys of the JSON object
                        for (var key in jsonData) {
                            // Check if the key is a property of the object (not inherited)
                            if (jsonData.hasOwnProperty(key)) {
                                // Concatenate the array associated with the current key to the allValues array
                                allValues = allValues.concat(jsonData[key]);
                            }
                        }
                        generateMonthWiseSummaryRows(allValues);
                        generateCategoryWiseSummaryRows(allValues);
                    }
                    else {
                        generateMonthWiseSummaryRows(jsonData[selectedOption]);
                        generateCategoryWiseSummaryRows(jsonData[selectedOption]);
                    }

                });
            });
        });

    </script>

</body>

</html>
