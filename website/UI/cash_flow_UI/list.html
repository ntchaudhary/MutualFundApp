<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Summary</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"> -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        .dropdown-menu[data-bs-popper] {
            top: 100%;
            left: auto;
            margin-top: .125rem;
        }
        @media (max-width: 768px) {
            .table-responsive table {
                font-size: 14px; /* Adjust the font size for smaller screens */
            }
        }

        @media (max-width: 576px) {
            .table-responsive table {
                font-size: 12px; /* Further reduce the font size for even smaller screens */
            }
        }

    </style>
</head>

<body class="d-flex text-center text-black">
    <div class="cover-container d-flex w-100 h-100 mx-auto flex-column pt-5">
        <div class="row row-cols-1">
            {% include "/include/navbar.html" %}

            <div class="col bg-black text-white">
                <div class="container py-5">
                    <div class="row">
                        
                            <h2>Select the year from the dropdown</h2>
                            <div class="dropdown">
                                <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
                                  Select an option
                                </button>
                                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                                    <li><a class="dropdown-item" href="#">All</a></li>
                                    {% for x in years %}                                    
                                        <li><a class="dropdown-item" href="#">{{x}}</a></li>
                                    {% endfor %}
                                </ul>
                            </div>                        
                    </div>
                    <br><br>
                    <div class="row">

                        <h2>Overall Cash Flow</h2>

                        <div class="col">
                            <h5>Total Expense</h5>
                            <h4 id="total_expense">₹ 0</h4>
                        </div>
                        <div class="col">
                            <h5>Total Income</h5>
                            <h4 id="total_income">₹ 0</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="container py-5">
                    <div class="row ">
                        <div class="col">
                            <h3>Month</h3>
                        </div>
                        <div class="col">
                            <h3>Total Expense</h3>
                        </div>
                        <div class="col">
                            <h3>Total Income</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div id="summary-table" class="container">
                    <div class="accordion" id="myAccordion">
                        <!-- dynamic code  -->
                    </div>

                </div>

            </div>

        </div>
    </div>


    <script>
        // Sample JSON data
        const jsonData = {{body|tojson}};

        // Function to generate summary rows based on month of expense_date
        function generateSummaryRows(data) {
            const summaryTable = document.getElementById('myAccordion');
            const summaryMap = new Map();
            var total_expense = 0
            var total_income = 0

            // Iterate over the data to calculate total expense and total income for each month
            data.forEach(item => {
                const month = item.expense_date.slice(0, 7); // Extracting the year and month
                if (!summaryMap.has(month)) {
                    summaryMap.set(month, {
                        totalExpense: 0,
                        totalIncome: 0,
                        details: []
                    });
                }
                if (item.income_expense === 'Expense') {
                    total_expense += item.amount ;
                    summaryMap.get(month).totalExpense += item.amount;
                } else if (item.income_expense === 'Income') {
                    total_income+=item.amount ;
                    summaryMap.get(month).totalIncome += item.amount;
                }
                summaryMap.get(month).details.push(item);
            });

            document.getElementById('total_expense').innerHTML = '₹ '+ new Intl.NumberFormat('en-IN').format(total_expense.toFixed(2));
            document.getElementById('total_income').innerHTML = '₹ '+ new Intl.NumberFormat('en-IN').format(total_income.toFixed(2));

            // Generate summary rows
            summaryMap.forEach((summaryData, month) => {
                const summaryRow = document.createElement('div');
                summaryRow.classList.add('accordion-item');
                summaryRow.innerHTML = `
                    <h2 class="accordion-header " id="header${month}">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${month}" aria-expanded="false" aria-controls="collapse${month}">
                            <div class="row w-100 h-100 mx-auto text-center">
                                <div class="col">
                                    <h4>${month}</h4>
                                </div>
                                <div class="col">
                                    <h4 class="text-danger">₹ ${new Intl.NumberFormat('en-IN').format(summaryData.totalExpense.toFixed(2))}</h4>
                                </div>
                                <div class="col">
                                    <h4 class="text-success">₹ ${new Intl.NumberFormat('en-IN').format(summaryData.totalIncome.toFixed(2))}</h4>
                                </div>
                            </div>
                        </button>
                    </h2>
                    <div id="collapse${month}" class="accordion-collapse collapse" aria-labelledby="header${month}" data-bs-parent="#myAccordion">
                        <div class="accordion-body">
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th>Category</th>
                                            <th>Sub Category</th>
                                            <th>Type</th>
                                            <th>Amount</th>
                                            <th>Note</th>
                                        </tr>
                                    </thead>
                                    <tbody class="details-row-${month}">
                                        <!-- Details rows will be dynamically generated here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                summaryTable.appendChild(summaryRow);

                // Generate details rows for each month
                summaryData.details.forEach(item => {
                    const detailsRow = document.createElement('tr');
                    detailsRow.innerHTML = `
                        <td>${item.expense_date}</td>
                        <td>${item.category}</td>
                        <td>${item.sub_category}</td>
                        <td>${item.income_expense}</td>
                        <td>₹ ${new Intl.NumberFormat('en-IN').format(item.amount.toFixed(2))}</td>
                        <td>${item.note}</td>
                    `;
                    // Add classes based on income_expense value
                    if (item.income_expense === 'Income') {
                        // detailsRow.bgColor = '#d6ffd6';
                        detailsRow.classList.add("table-success");
                    } else if (item.income_expense === 'Expense') {
                        // detailsRow.bgColor= "#b42d2d";
                        detailsRow.classList.add("table-danger");
                    }
                    summaryRow.querySelector(`.details-row-${month}`).appendChild(detailsRow);
                });

            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            // Get dropdown menu
            var dropdownMenu = document.getElementById('dropdownMenuButton');

            // Get dropdown items
            var dropdownItems = document.querySelectorAll('.dropdown-item');

            // Attach event listener for 'click' event on dropdown items
            dropdownItems.forEach(function(item) {
            item.addEventListener('click', function(event) {
                // Get selected option
                var selectedOption = event.target.textContent.trim();

                // Set the selected option as dropdown button text
                dropdownMenu.textContent = selectedOption;

                // Get reference to the div
                var myAccordion = document.getElementById('myAccordion');
                
                // Clear its content
                myAccordion.innerHTML = '';

                if (selectedOption === 'All') {
                    // Initialize an empty array to store the values
                    var allValues = [];

                    // Iterate over the keys of the JSON object
                    for (var key in jsonData) {
                    // Check if the key is a property of the object (not inherited)
                        if (jsonData.hasOwnProperty(key)) {
                            // Concatenate the array associated with the current key to the allValues array
                            allValues = allValues.concat(jsonData[key]);
                        }
                    }
                    generateSummaryRows(allValues);
                }
                else {
                    generateSummaryRows(jsonData[selectedOption]);
                }
                
                });
            });
        });

    </script>

</body>

</html>
