<!doctype html>
<html lang="en" class="h-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investment Tracker</title>

  <!-- Updated Bootstrap version -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .dropdown-menu[data-bs-popper] {
      top: 100%;
      left: auto;
      margin-top: .125rem;
    }

    .transaction-row {
      border-bottom: 1px solid #dee2e6;
      padding: 1rem 0;
    }

    .transaction-row:last-child {
      border-bottom: none;
    }

    .transaction-row h5 {
      margin-bottom: 0;
    }

    .section-header {
      background-color: #000;
      color: white;
      padding: 2rem 0;
    }

    .btn-custom {
      font-weight: bold;
      background-color: white;
    }

    .bg-scheme {
      background-color: #f8f9fa;
    }

    @media (max-width: 768px) {
      .transaction-row h5 {
        font-size: 14px;
      }
    }

    @media (max-width: 576px) {
      .transaction-row h5 {
        font-size: 12px;
      }
    }
  </style>

  <script type="text/javascript">
    function sellEntry(fund_id__id) {
      var txt = "https://y2fojxywli65on7j6bnavxvegy0kepwb.lambda-url.ap-south-1.on.aws/website/fund/" + fund_id__id + "/sell/";
      let options = {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json;charset=utf-8' }
      }
      if (confirm("Are you sure you want to sell these units?")) {
        fetch(txt, options)
          .then(res => res.json())
          .then(d => alert(d.message))
          .finally(() => window.location.reload());
      } else {
        window.location.reload();
      }
    }
  </script>
</head>

<body class="d-flex text-center text-dark bg-light">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <div class="cover-container d-flex w-100 h-100 mx-auto flex-column pt-5">
    <div class="row row-cols-1">
      {% include "/include/navbar.html" %}

      <!-- Scheme Header -->
      <div class="col section-header">
        <h1><strong>{{ body.schemeName }}</strong></h1>
        <div class="mt-3">
          <a href="/website/fund/{{ body.schemeCode }}/update" class="btn btn-custom">Add New Purchase</a>
        </div>
        <div class="mt-4">
          <h6>Below are the list of all transactions done on this fund</h6>
        </div>
      </div>

      <!-- Transactions Section -->
      <div class="col bg-scheme py-5">
        <div class="container">
          <div class="row text-center mb-3">
            <div class="col"><h5><strong>Date</strong></h5></div>
            <div class="col"><h5><strong>Units</strong></h5></div>
            <div class="col"><h5><strong>Amount</strong></h5></div>
            <div class="col"><h5><strong>Action</strong></h5></div>
          </div>

          {% for x in body.list %}
          <div class="row text-center align-items-center transaction-row">
            <div class="col"><h5>{{ x.unit_date }}</h5></div>
            <div class="col"><h5>{{ x.number_of_units }}</h5></div>
            <div class="col"><h5 id="{{ x.fund_id__id }}"></h5></div>
            <div class="col">
              <button onclick="sellEntry('{{ x.fund_id__id }}')" class="btn btn-sm btn-outline-danger">Sell</button>
            </div>
          </div>
          <script>
            document.addEventListener('DOMContentLoaded', function () {
              const amount = '{{ x.amount_invested }}';
              const el = document.getElementById('{{ x.fund_id__id }}');
              if (el) {
                const nf = new Intl.NumberFormat('en-IN');
                el.innerHTML = "₹" + nf.format(parseFloat(amount));
              }
            });
          </script>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</body>
</html>
