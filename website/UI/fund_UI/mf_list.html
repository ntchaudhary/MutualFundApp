<!doctype html>
<html lang="en" class="h-100">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investment Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* REMOVED: This rule is generally not needed as Bootstrap handles overflow. */
    /* html, body {
      max-width: 100%;
      overflow-x: hidden;
    } */
    .dropdown-menu[data-bs-popper] {
      top: 100%;
      left: auto;
      margin-top: .125rem;
    }
    /* Edge-to-edge accordion */
    .accordion {
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .accordion-item {
      border: none;
      /* horizontal divider */
      border-bottom: 1px solid #dee2e6;
    }
    /* ADDED: Ensures the last accordion item doesn't have a bottom border if it's not desired. */
    .accordion-item:last-child {
      border-bottom: none;
    }
    .accordion-button {
      padding: 1rem;
    }
    /* Remove borders between columns in accordion body */
    /* MODIFIED: Combined and simplified these rules. Bootstrap's grid system handles internal borders well. */
    .accordion-body .row > .col {
      border: none; /* Kept for explicit removal */
    }
    /* REMOVED: This was redundant as border: none already applied. */
    /* .accordion-body .row > .col:last-child {
      border-right: none;
    } */
    /* MODIFIED: Combined media queries for better organization. */
    @media (max-width: 768px) {
      .accordion-body .row > .col { font-size: 14px; }
    }
    @media (max-width: 576px) {
      .accordion-body .row > .col { font-size: 12px; }
    }
  </style>

  <script>
    // RENAMED: `separateNumber` to `formatCurrency` for clarity.
    // ADDED: Check for `el` to prevent errors if element is not found.
    function formatCurrency(num, id) {
      const nf = new Intl.NumberFormat('en-IN');
      const el = document.getElementById(id);
      if (el) el.innerHTML = "₹" + nf.format(parseFloat(num));
    }

    function buildPage(data, agg) {
      document.getElementById('count').textContent = agg.count;
      // MODIFIED: Use the new function name.
      ['invested','current','totalReturn','totalharvest'].forEach(k =>
        formatCurrency(agg[k], k)
      );

      // ADDED: Color logic for totalReturn and current
      const totalReturnEl = document.getElementById('totalReturn');
      const totalcurrentEl = document.getElementById('current');
      if (agg.totalReturn < 0) {
        totalReturnEl.classList.add('text-danger');
        totalcurrentEl.classList.add('text-danger');
      } else if (agg.totalReturn > 0) {
        totalReturnEl.classList.add('text-success');
        totalcurrentEl.classList.add('text-success');
      }

      const acc = document.getElementById('schemesAccordion');
      acc.innerHTML = '';
      data.forEach(item => {
        const code = item.scheme_code;
        const clean = code.replace(/\s+/g, '_');

        const itm = document.createElement('div');
        itm.className = 'accordion-item';
        itm.innerHTML = `
          <h2 class="accordion-header" id="heading-${clean}">
            <button class="accordion-button collapsed" type="button"
                    data-bs-toggle="collapse" data-bs-target="#collapse-${clean}"
                    aria-expanded="false" aria-controls="collapse-${clean}">
              <div class="row w-100 text-center">
                <div class="col">
                  <div class="h6"><strong>${item.scheme_name}</strong></div>
                </div>
                <div class="col">
                  <div class="h5" id="${clean}-inv"></div>
                </div>
                <div class="col">
                  <div class="h5" id="${clean}-cur"></div>
                </div>
              </div>
            </button>
          </h2>
          <div id="collapse-${clean}" class="accordion-collapse collapse"
               aria-labelledby="heading-${clean}" data-bs-parent="#schemesAccordion">
            <div class="accordion-body">
              <div class="row d-flex align-items-center">
                <div class="col">
                  <div class="row text-center align-items-center">
                    <div class="col">
                        <div class="h5"><strong>Return</strong></div>
                    </div>
                    <div class="col">
                        <div class="h5"><strong>Exit Period</strong></div>
                    </div>
                    <div class="col">
                        <div class="h5"><strong>Reinvest Amt</strong></div>
                    </div>
                    <div class="col">
                        <div class="h5"><strong>Sell Units</strong></div>
                    </div>
                    <div class="col">
                        <div class="h5"><strong>Amt Req’d</strong></div>
                    </div>
                  </div>
                  <div class="row text-center align-items-center">
                    <div class="col">
                        <div class="h5" id="${clean}-ret"></div>
                    </div>
                    <div class="col">
                        <div class="h5">${item.exitTime} yr(s)</div>
                    </div>
                    <div class="col">
                        <div class="h5" id="${clean}-harv"></div>
                    </div>
                    <div class="col">
                        <div class="h5" id="${clean}-units">${item.harvest_unit}</div>
                    </div>
                    <div class="col">
                        <div class="h5" id="${clean}-req"></div>
                    </div>
                  </div>
                </div>
                <div class="col-md-auto">
                  <a href="/website/fund-transactions-list/${code}" class="btn btn-sm btn-outline-primary" aria-label="View transactions for ${item.scheme_name}">View Transactions</a>
                </div>
              </div>
            </div>
          </div>
        `;

        acc.appendChild(itm);

        // MODIFIED: Use the new function name.
        formatCurrency(item.invested, `${clean}-inv`);
        formatCurrency(item.balance_units_value, `${clean}-cur`);
        formatCurrency(item.gainLoss, `${clean}-ret`);
        formatCurrency(item.harvest, `${clean}-harv`);
        formatCurrency(item.harvesting_amt_req, `${clean}-req`);

        // color logic: container light-red if sell units > 0
        const body = itm.querySelector('.accordion-body');
        // MODIFIED: Changed background colors for better aesthetics and clearer distinction.
        if (parseFloat(item.harvest_unit) > 0) {
          body.classList.add('bg-warning-subtle'); // Use a softer warning color
        } else {
          body.classList.add('bg-light'); // Use a neutral light background
        }
        // ADDED: Ensure text remains dark on all backgrounds.
        body.querySelectorAll('h6, h5, h4, h3, h2, p, span, a, div').forEach(el => el.classList.add('text-dark'));


        // color current value: red if return < 0, green if > 0: red if return < 0, green if > 0
        const curEl = document.getElementById(`${clean}-cur`);
        const retEl = document.getElementById(`${clean}-ret`); // ADDED: Element for return value
        if (item.gainLoss < 0) {
          curEl.classList.add('text-danger');
        } else if (item.gainLoss > 0) {
          curEl.classList.add('text-success');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const aggregates = {
        count: {{ count }},
        invested: {{ invested }},
        current: {{ current }},
        totalReturn: {{ totalReturn }},
        totalharvest: {{ totalharvest }}
      };
      const schemes = {{ body | tojson }};
      buildPage(schemes, aggregates);
    });
  </script>
</head>

<body class="d-flex text-center text-black">
  <div class="cover-container d-flex w-100 h-100 mx-auto flex-column pt-5">
    <div class="row row-cols-1">
      {% include "/include/navbar.html" %}
      <div class="col bg-black text-white">
        <div class="py-5">
          <h1><strong>Number of investments</strong> – <span id="count"></span></h1>
          <div class="row mt-4">
            <div class="col py-2"><h5><strong>Total Invested</strong></h5><h2 id="invested"></h2></div>
            <div class="col py-2"><h5><strong>Total Current</strong></h5><h2 id="current"></h2></div>
            <div class="col py-2"><h5><strong>Total Return</strong></h5><h2 id="totalReturn"></h2></div>
            <div class="col py-2"><h5><strong>Total Reinvest Amt</strong></h5><h2 id="totalharvest"></h2></div>
          </div>
        </div>
      </div>
      <div class="col px-0">
        <div class="py-5">
          <div class="row text-center mb-3">
            <div class="col h3"><strong>Your Schemes</strong></div>
            <div class="col h3"><strong>Invested</strong></div>
            <div class="col h3"><strong>Current</strong></div>
          </div>
          <div class="accordion" id="schemesAccordion"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
