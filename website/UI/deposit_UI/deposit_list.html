<!doctype html>
<html lang="en" class="h-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Investment Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        .dropdown-menu[data-bs-popper] {
            top: 100%;
            left: auto;
            margin-top: .125rem;
        }
        @media (max-width: 768px) {
            .table-responsive table {
                font-size: 14px; /* Adjust the font size for smaller screens */
            }
        }

        @media (max-width: 576px) {
            .table-responsive table {
                font-size: 12px; /* Further reduce the font size for even smaller screens */
            }
        }

    </style>

  <script type="text/javascript">
    function separateNumber(givenNumber, tag_id) 
    {

        nfObject = new Intl.NumberFormat('en-IN');
        output = nfObject.format(givenNumber);

        document.getElementById(tag_id).innerHTML = "₹"+output;
    }

    function deleteEntry(fdID) 
    {
        var txt = "https://y2fojxywli65on7j6bnavxvegy0kepwb.lambda-url.ap-south-1.on.aws/website/delete/"+fdID;
        let options = {
            method: 'DELETE',
            headers: {
                'Content-Type': 
                    'application/json;charset=utf-8'
            }
        }
        if (confirm("Are you sure you want to delete deposit entry")) 
        {
          let fetchRes = fetch(txt,options);
          fetchRes.then(res =>
            res.json()).then(d => {
              alert(d.message);
            })
          window.location.reload();
        } else {
          window.location.reload();
        }
    }
  </script>
</head>

<body class="d-flex text-center text-black">
  <div class="cover-container d-flex w-100 h-100 mx-auto flex-column pt-5">
      <div class="row row-cols-1">

      {% include "/include/navbar.html" %}

      <div class="col bg-black text-white">
        <div class="py-5">
            <div class="row">
                <h1>Number of deposits - <span class="my-0">{{count}}</span></h1>
            </div>
            <br />
            <div class="row">
              <div class="col">
                <h4>Total Invested</h4>
                <h2 id="totalPrinciple">{{totalPrinciple}}</h2>
              </div>
              <div class="col">
                  <h4>Accrued Interest</h4>
                  <h2 id="total_interest_earned">{{total_interest_earned}}</h2>
              </div>
              <!-- <div class="col"> -->
							<!-- <h4>Matured Deposits</h4> -->
							<!-- <h2>1</h2> -->
						  <!-- </div> -->
						<div class="col">
							<a href="/website/add-deposit" class="btn btn-sm fw-bold bg-white">Add New Deposit</a>
						</div>
					</div>
				</div>
			</div>
        <script>
          separateNumber('{{totalPrinciple}}','totalPrinciple');
          separateNumber('{{total_interest_earned}}','total_interest_earned');
        </script>
		
    <div class="col">
      <div class="py-5">
        <div class="row ">
          <div class="col">
            <h3>Bank</h3>
          </div>
          <div class="col">
            <h3>Total Invested</h3>
          </div>
          <div class="col">
            <h3>Matured</h3>
          </div>
        </div>
      </div>
    </div>
      
    <div class="col">
      <div id="summary-table">
        <div class="accordion" id="myAccordionBank">
          <!-- dynamic code  -->
        </div>
      </div>
    </div>
  </div>
</div>

<script>

const jsonData = {{ body| tojson}};
// Function to generate summary rows based on bank
function generateBankWiseSummaryRows(data) {
const summaryTable = document.getElementById('myAccordionBank');
const summaryMap = new Map();

// Iterate over the data to calculate total expense and total income for each bank
data.forEach(item => {
  const bank = item.bank.replaceAll(' ', '_'); // Extracting the bank
  if (!summaryMap.has(bank)) {
    summaryMap.set(bank, {
      totalInvested: 0,
      totalMatured: 0,
      details: []
    });
  }
  if (item.isMatured === "Yes") {
    summaryMap.get(bank).totalMatured += 1;
  } 
  
  summaryMap.get(bank).totalInvested += item.principle;
  
  if (item.hasOwnProperty("installment")) {
  item.installment = "₹ " + new Intl.NumberFormat('en-IN').format(item.installment.toFixed(2))

  }
  else{
  item.installment = ""
  }
  
  summaryMap.get(bank).details.push(item);
});

// Generate summary rows
summaryMap.forEach((summaryData, bank) => {
  const summaryRow = document.createElement('div');
  summaryRow.classList.add('accordion-item');
  summaryRow.innerHTML = `
    <h2 class="accordion-header " id="header${bank}">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${bank}" aria-expanded="false" aria-controls="collapse${bank}">
        <div class="row w-100 h-100 mx-auto text-center">
          <div class="col">
            <h6>${bank.replaceAll('_', ' ')}</h6>
          </div>
          <div class="col">
            <h6 class="text-dark">₹ ${new Intl.NumberFormat('en-IN').format(summaryData.totalInvested.toFixed(2))}</h6>
          </div>
          <div class="col">
            <h6 class="text-dark">${summaryData.totalMatured}</h6>
          </div>
        </div>
      </button>
    </h2>
    <div id="collapse${bank}" class="accordion-collapse collapse" aria-labelledby="header${bank}" data-bs-parent="#myAccordionBank">
      <div class="accordion-body">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Account Number</th>
                <th>Installment</th>
                <th>Invested</th>
                <th>Maturity</th>
                <th>Interest(till date)</th>
                <th>Interest Rate</th>
                <th>Duration</th>
                <th>Start Date</th>
                <th>Maturity Date</th>
                <th>Matured</th>
                <th>Note</th>
                <!-- <th>Remove Deposit</th> -->
              </tr>
            </thead>
            <tbody class="details-row-${bank}">
              <!-- Details rows will be dynamically generated here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  summaryTable.appendChild(summaryRow);

  // Generate details rows for each bank
  summaryData.details.forEach(item => {
    const detailsRow = document.createElement('tr');
    detailsRow.innerHTML = `
      <td>${item.type}</td>
      <td>${item.account_number}</td>
      <td>${item.installment}</td>
      <td>₹ ${new Intl.NumberFormat('en-IN').format(item.principle.toFixed(2))}</td>
      <td>₹ ${new Intl.NumberFormat('en-IN').format(item.maturity_amount.toFixed(2))}</td>
      <td>₹ ${new Intl.NumberFormat('en-IN').format(item.interest_earned.toFixed(2))}</td>
      <td>${item.rate} %</td>
      <td>${item.duration}</td>
      <td>${item.start_date}</td>
      <td>${item.maturity_date}</td>
      <td>${item.isMatured}</td>
      <td>${item.note}</td>
      <td><button onclick="deleteEntry(${item.id})" class="btn btn-sm fw-bold bg-white">Delete</button></td>
    `;
    // Add classes based on income_expense value
    if (item.isMatured === 'Yes') {
      // detailsRow.bgColor= "#b42d2d";
      detailsRow.classList.add("table-danger");
    }
    else {
      detailsRow.classList.add("table-success")
    }
    summaryRow.querySelector(`.details-row-${bank}`).appendChild(detailsRow);
  });

});
}

generateBankWiseSummaryRows(jsonData);
</script>

</body>
</html>
